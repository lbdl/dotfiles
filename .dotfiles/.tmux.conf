unbind r
bind r source-file ~/.tmux.conf
set -g base-index 1
set -g default-terminal "screen-256color"

# ----------------------
# Prefix binding
# ----------------------
set -g prefix C-q
unbind C-r
bind C-q send-prefix 

# ----------------------
# Status bar colors
# ----------------------
set-option -g status-style bg=colour235,fg=yellow,dim

# ----------------------
# Window list colors
# ----------------------
set-window-option -g window-status-style fg=brightblue,bg=colour236,dim
set-window-option -g window-status-current-style fg=brightred,bg=colour236,bright

# ----------------------
# Pane colors
# ----------------------
set-option -g pane-border-style fg=colour235
set-option -g pane-active-border-style fg=colour250

# ----------------------
# Command line messages
# ----------------------
set-option -g message-style bg=black,fg=brightred

# ----------------------
# Status Bar
# -----------------------
set-option -g status on
set -g status-interval 30
set -g status-justify centre
set -g status-left-length 60
set -g status-right-length 40

# ----------------------
# Pane navigation
# -----------------------
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# ----------------------
# Ctrl arrow navigation (iTerm2 meta key setting)
# ----------------------
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# ----------------------
# Window navigation
# -----------------------
bind -n S-Left previous-window
bind -n S-Right next-window

# ----------------------
# Status bar content
# ----------------------
set -g status-right '%Y-%m-%d %H:%M'
set -g status-left "[#S] [#h #[fg=green] #[fg=yellow]#(ifconfig en0 | grep 'inet ' | awk '{print \"en0 \" $2}')#(ifconfig en1 | grep 'inet ' | awk '{print \" en1 \" $2}')]"
set -s escape-time 1

# ----------------------
# Window titles
# ----------------------
set -g set-titles on

# ----------------------
# OSX integration
# ----------------------
#set-option -g default-command "reattach-to-user-namespace -l zsh"

# ----------------------
# Vi mode
# ----------------------
setw -g mode-keys vi

# ----------------------
# Shell
# ----------------------
set-option -g default-shell /bin/zsh

# ----------------------
# History
# ----------------------

set-option -g history-limit 50000
# ----------------------
# Mouse
# ----------------------
set -g mouse on


# ----------------------
# Plugin Manager
# ----------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ----------------------
# Restore Plugins
# ----------------------
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Configure autosave interval
set -g @continuum-save-interval '15'
# Enable automatic restore
set -g @continuum-restore 'on'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
